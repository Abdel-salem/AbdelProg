<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flexera - Welcome Preview v2</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1f2430;
  }
  .app {
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    background: linear-gradient(180deg, #e7eefc 0%, #cfdcf5 100%);
    display: flex;
    flex-direction: column;
    padding: 0 26px 32px;
  }

  .brand {
    text-align: center;
    margin: 56px 0 0;
    font-weight: 800;
    font-size: 2.3rem;
    letter-spacing: 1px;
    color: #1f3a5f;
  }
  .brand .accent { color: #5b8def; }

  .illustration {
    width: 100%;
    max-width: 280px;
    margin: 28px auto 0;
    display: block;
  }

  .headline {
    text-align: center;
    margin: 18px 0 4px;
    font-weight: 800;
    font-size: 1.55rem;
    color: #1f2430;
  }
  .tagline {
    text-align: center;
    margin: 0;
    font-size: 0.92rem;
    color: #4f7fe0;
    font-weight: 600;
  }

  .actions {
    margin-top: auto;
    padding-top: 36px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    height: 54px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 0.92rem;
    cursor: pointer;
    border: none;
    transition: transform 0.1s ease;
  }

  .btn-primary {
    background: #1f3a5f;
    color: white;
    box-shadow: 0 8px 18px rgba(31,58,95,0.28);
  }

  .btn-outline {
    background: white;
    color: #1f3a5f;
    border: 1.6px solid #d7e1f3;
    box-shadow: 0 2px 8px rgba(31,58,95,0.06);
  }
</style>
</head>
<body>
<div class="app">

  <div class="brand">FLEX<span class="accent">ERA</span></div>

  <svg class="illustration" viewBox="0 0 260 220" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="130" cy="200" rx="100" ry="10" fill="#d7e3f7"/>
    <path d="M60 30c50-20 90 10 70 60-15 38-40 50-40 90h-30c0-40-25-52-40-90-20-50 0-60 40-60z"
          fill="#ffffff" stroke="#cdddf6" stroke-width="2"/>
    <path d="M70 60c8-10 22-12 30 0" stroke="#9fb8e8" stroke-width="3" stroke-linecap="round"/>
    <g>
      <rect x="160" y="38" width="58" height="58" rx="10" fill="#ffffff" stroke="#cdddf6" stroke-width="3"/>
      <circle cx="171" cy="50" r="2.6" fill="#4f7fe0"/>
      <circle cx="187" cy="50" r="2.6" fill="#4f7fe0"/>
      <circle cx="203" cy="50" r="2.6" fill="#4f7fe0"/>
      <rect x="166" y="60" width="9" height="9" rx="2" fill="#dbe7fb"/>
      <rect x="182" y="60" width="9" height="9" rx="2" fill="#dbe7fb"/>
      <rect x="198" y="60" width="9" height="9" rx="2" fill="#1f3a5f"/>
      <path d="M199 63.5l2 2 4-5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <rect x="166" y="74" width="9" height="9" rx="2" fill="#dbe7fb"/>
      <rect x="182" y="74" width="9" height="9" rx="2" fill="#dbe7fb"/>
      <rect x="198" y="74" width="9" height="9" rx="2" fill="#dbe7fb"/>
    </g>
    <path d="M20 130l28-20 20 11 38-32 28 17" stroke="#4f7fe0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M130 98l13 8-2 14" stroke="#4f7fe0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <ellipse cx="50" cy="168" rx="22" ry="8.5" fill="#cfe0fb"/>
      <ellipse cx="50" cy="160" rx="22" ry="8.5" fill="#bcd5fa"/>
      <ellipse cx="50" cy="152" rx="22" ry="8.5" fill="#a9c9f8"/>
      <ellipse cx="50" cy="144" rx="22" ry="8.5" fill="#8fb6f5"/>
    </g>
    <ellipse cx="96" cy="175" rx="17" ry="7" fill="#cfe0fb"/>
  </svg>

  <h1 class="headline">Welcome to Flexera</h1>
  <p class="tagline">The ERA of Flexible Finance</p>

  <div class="actions">
    <button class="btn btn-primary">👤 Continue as Guest</button>
    <button class="btn btn-outline">🔒 Login</button>
    <button class="btn btn-outline">🧑‍💼 Sign Up</button>
  </div>

</div>
</body>
</html>
