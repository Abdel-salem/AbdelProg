<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flexera - Welcome Preview</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6fb;
    color: #1f2430;
  }
  .app {
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    background: linear-gradient(180deg, #eaf1ff 0%, #f4f6fb 55%);
    display: flex;
    flex-direction: column;
    padding-bottom: 28px;
  }

  .brand {
    text-align: center;
    margin: 48px 0 6px;
    font-weight: 800;
    font-size: 2rem;
    letter-spacing: 1px;
    color: #1f3a5f;
  }
  .brand .accent { color: #3a7bfd; }

  .illustration-card {
    margin: 18px 28px 0;
    background: white;
    border-radius: 24px;
    padding: 28px 20px;
    box-shadow: 0 8px 24px rgba(31,58,95,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .illustration {
    width: 100%;
    max-width: 260px;
  }

  .headline {
    text-align: center;
    margin: 28px 24px 6px;
    font-weight: 800;
    font-size: 1.5rem;
    color: #1f2430;
  }
  .tagline {
    text-align: center;
    margin: 0 24px;
    font-size: 0.92rem;
    color: #3a7bfd;
    font-weight: 600;
  }

  .actions {
    margin-top: auto;
    padding: 36px 24px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 52px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.92rem;
    cursor: pointer;
    border: none;
  }

  .btn-primary {
    background: #1f3a5f;
    color: white;
    box-shadow: 0 6px 16px rgba(31,58,95,0.25);
  }

  .btn-outline {
    background: white;
    color: #1f3a5f;
    border: 1.6px solid #1f3a5f;
  }

  .btn-ghost {
    background: transparent;
    color: #3a7bfd;
    border: none;
    height: 36px;
    font-size: 0.85rem;
  }

  .signup-row {
    text-align: center;
    font-size: 0.85rem;
    color: #6b7280;
    margin-top: 4px;
  }
  .signup-row span {
    color: #3a7bfd;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="app">

  <div class="brand">FLEX<span class="accent">ERA</span></div>

  <div class="illustration-card">
    <svg class="illustration" viewBox="0 0 260 220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="130" cy="200" rx="100" ry="10" fill="#eaf1ff"/>
      <path d="M60 30c50-20 90 10 70 60-15 38-40 50-40 90h-30c0-40-25-52-40-90-20-50 0-60 40-60z"
            fill="#e7eefc" stroke="#bcd0f4" stroke-width="2"/>
      <rect x="60" y="40" width="60" height="78" rx="20" fill="#ffffff" stroke="#cdddf6" stroke-width="3"/>
      <path d="M70 60c8-10 22-12 30 0" stroke="#9fb8e8" stroke-width="3" stroke-linecap="round"/>
      <g>
        <rect x="150" y="40" width="55" height="55" rx="10" fill="#ffffff" stroke="#cdddf6" stroke-width="3"/>
        <circle cx="161" cy="52" r="2.6" fill="#3a7bfd"/>
        <circle cx="177" cy="52" r="2.6" fill="#3a7bfd"/>
        <circle cx="193" cy="52" r="2.6" fill="#3a7bfd"/>
        <rect x="156" y="62" width="9" height="9" rx="2" fill="#dbe7fb"/>
        <rect x="172" y="62" width="9" height="9" rx="2" fill="#dbe7fb"/>
        <rect x="188" y="62" width="9" height="9" rx="2" fill="#1f3a5f"/>
        <path d="M189 65.5l2 2 4-5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <rect x="156" y="75" width="9" height="9" rx="2" fill="#dbe7fb"/>
        <rect x="172" y="75" width="9" height="9" rx="2" fill="#dbe7fb"/>
        <rect x="188" y="75" width="9" height="9" rx="2" fill="#dbe7fb"/>
      </g>
      <path d="M30 130l25-18 20 10 35-30 25 15" stroke="#3a7bfd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M125 100l10 7-2 12" stroke="#3a7bfd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <g>
        <ellipse cx="55" cy="165" rx="20" ry="8" fill="#cfe0fb"/>
        <ellipse cx="55" cy="158" rx="20" ry="8" fill="#bcd5fa"/>
        <ellipse cx="55" cy="151" rx="20" ry="8" fill="#a9c9f8"/>
        <ellipse cx="55" cy="144" rx="20" ry="8" fill="#96bdf6"/>
      </g>
      <ellipse cx="95" cy="172" rx="16" ry="6.5" fill="#cfe0fb"/>
    </svg>
  </div>

  <h1 class="headline">Welcome to Flexera</h1>
  <p class="tagline">The ERA of Flexible Finance</p>

  <div class="actions">
    <button class="btn btn-primary">👤 Continue as Guest</button>
    <button class="btn btn-outline">🔒 Login</button>
    <div class="signup-row">Don't have an account? <span>Sign Up</span></div>
  </div>

</div>
</body>
</html>
